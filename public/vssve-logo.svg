<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#000000" rx="36" />

  <!-- Outer Big V (White Inverted Triangle) -->
  <polygon points="36,26 464,26 250,430" fill="#FFFFFF" />

  <!-- "SS" in top-left (Black Block Text) -->
  <g fill="#000000">
    <!-- First 'S' -->
    <path d="M 84,33 L 120,33 L 120,44 L 97,44 L 97,50 L 120,50 L 120,76 L 84,76 L 84,65 L 107,65 L 107,59 L 84,59 Z" />
    <!-- Second 'S' -->
    <path d="M 124,33 L 160,33 L 160,44 L 137,44 L 137,50 L 160,50 L 160,76 L 124,76 L 124,65 L 147,65 L 147,59 L 124,59 Z" />
  </g>

  <!-- Inner V cutout/glyph (Black V Stroke) -->
  <polyline
    points="178,26 250,162 322,26"
    fill="none"
    stroke="#000000"
    stroke-width="26"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
  />

  <!-- Lowercase 'e' (White) on the right of the triangle tip -->
  <text
    x="360"
    y="415"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="105"
  >e</text>

  <!-- "VSSVe Studios" Text at Bottom -->
  <text
    x="250"
    y="480"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="36"
    letter-spacing="1.5"
  >VSSVe Studios</text>
</svg>
